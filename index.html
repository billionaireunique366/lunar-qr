<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b1f">
<title>Lunar Viewpoint Bar · Presente</title>
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100vh;min-height:100dvh;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#f5f2e9;background:#060b1f;
  background:radial-gradient(120% 80% at 70% 0%,#132055 0%,#0a1236 45%,#060b1f 100%);
  -webkit-tap-highlight-color:transparent;
}
/* Estrelas */
.sky,.sky::after{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none}
.sky{
  background-image:
    radial-gradient(1px 1px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 120px 80px,#dfe6ff,transparent),
    radial-gradient(1.5px 1.5px at 60px 150px,#fff,transparent),
    radial-gradient(1px 1px at 170px 190px,#cfd8ff,transparent),
    radial-gradient(1px 1px at 90px 230px,#fff,transparent);
  background-size:200px 260px;opacity:.55;
}
.sky::after{
  content:"";
  background-image:
    radial-gradient(1.5px 1.5px at 40px 60px,#fff,transparent),
    radial-gradient(1px 1px at 150px 20px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 110px 200px,#f3e7c0,transparent);
  background-size:230px 300px;
  animation:twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:.9}}
/* Lua */
.moon{
  position:fixed;top:5%;right:9%;width:62px;height:62px;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 62% 58%,rgba(160,150,120,.35) 0 6px,transparent 7px),
    radial-gradient(circle at 35% 70%,rgba(160,150,120,.3) 0 4px,transparent 5px),
    radial-gradient(circle at 38% 34%,#fffbea,#ece5c8 60%,#c8c0a2);
  box-shadow:0 0 28px 6px rgba(255,238,190,.22),0 0 80px 20px rgba(255,238,190,.08);
}
.moon::after{
  content:"";position:absolute;top:-30px;left:-30px;right:-30px;bottom:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,180,.18),transparent 65%);
  animation:glow 5s ease-in-out infinite alternate;
}
@keyframes glow{from{opacity:.5}to{opacity:1}}

/* Ecrãs */
.screen{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;
  padding:24px 20px;overflow-y:auto;text-align:center;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s ease,visibility 0s linear .5s;
}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease .15s,transform .5s ease .15s,visibility 0s}
.inner{width:100%;max-width:360px;margin:auto} /* margin:auto centra sem cortar o topo quando há scroll */
h1,h2{outline:none}
.brand{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:#d9c08a;margin:0 0 10px}
h1{font-size:1.65rem;line-height:1.2;margin:0 0 8px;font-weight:700}
.sub{margin:0 0 22px;color:#c9cfe2;font-size:1rem;line-height:1.4}

/* Formulário */
form{text-align:left}
.field{margin-bottom:14px}
label{display:block;font-weight:600;font-size:.95rem;margin:0 0 6px;color:#eef0f7}
input{
  width:100%;min-height:52px;padding:12px 14px;font:inherit;font-size:1.05rem;color:#fff;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(214,222,240,.35);border-radius:12px;
  -webkit-appearance:none;appearance:none;
}
input::placeholder{color:#8f98b5}
input:focus{outline:none;border-color:#e8c26a;background:rgba(255,255,255,.1)}
input[aria-invalid="true"]{border-color:#ff9a8a}
.err{min-height:1.2em;margin:5px 2px 0;font-size:.88rem;color:#ffb3a7}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:12px 20px;
  font:inherit;font-size:1.08rem;font-weight:700;color:#1a1430;text-decoration:none;
  background:linear-gradient(180deg,#f6d98e,#e2b453);border:0;border-radius:14px;cursor:pointer;
  box-shadow:0 6px 20px rgba(226,180,83,.28),inset 0 1px 0 rgba(255,255,255,.6);
}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.gift:focus-visible{outline:3px solid #fff;outline-offset:3px}
form .btn{margin-top:6px}

/* Caixa de presente */
.float{animation:float 3.2s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.gift{position:relative;display:block;width:170px;height:180px;margin:0 auto;padding:0;border:0;background:none;cursor:pointer;border-radius:16px}
.halo{
  position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
  background:radial-gradient(circle,rgba(246,212,130,.45),rgba(246,212,130,0) 65%);
  animation:pulse 2.2s ease-in-out infinite;will-change:transform,opacity;
}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.08);opacity:1}}
.box,.lid,.beam{position:absolute;left:50%}
.box{
  bottom:0;width:138px;height:106px;margin-left:-69px;z-index:2;border-radius:6px 6px 10px 10px;
  background:linear-gradient(90deg,#1b2a66,#31479e 45%,#1b2a66);
  box-shadow:inset 0 0 0 2px rgba(232,194,106,.5),0 14px 26px rgba(0,0,0,.45);
}
.box::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;margin-left:-11px;background:linear-gradient(90deg,#c99a3c,#f7dd94,#c99a3c)}
.lid{
  top:44px;width:156px;height:34px;margin-left:-78px;z-index:3;border-radius:7px;
  background:linear-gradient(90deg,#22337a,#3d56b8 45%,#22337a);
  box-shadow:inset 0 0 0 2px rgba(232,194,106,.6),0 4px 8px rgba(0,0,0,.35);
  transform-origin:20% 100%;
  transition:transform .55s cubic-bezier(.3,1.4,.5,1);
}
.lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:24px;margin-left:-12px;background:linear-gradient(90deg,#c99a3c,#f7dd94,#c99a3c)}
.lid::after{ /* laço */
  content:"";position:absolute;left:50%;top:-26px;width:60px;height:30px;margin-left:-30px;
  background:
    radial-gradient(ellipse 15px 12px at 15px 15px,transparent 5px,#f2d17f 6px,#d9a94a 15px,transparent 16px),
    radial-gradient(ellipse 15px 12px at 45px 15px,transparent 5px,#f2d17f 6px,#d9a94a 15px,transparent 16px),
    radial-gradient(circle at 30px 22px,#f7dd94 0 7px,transparent 8px);
}
.beam{
  bottom:90px;width:160px;height:340px;margin-left:-80px;z-index:1;pointer-events:none;
  background:linear-gradient(to top,rgba(255,244,205,.95),rgba(255,236,170,.35) 55%,rgba(255,236,170,0));
  -webkit-clip-path:polygon(32% 100%,68% 100%,100% 0,0 0);clip-path:polygon(32% 100%,68% 100%,100% 0,0 0);
  transform-origin:50% 100%;transform:scaleY(0);opacity:0;
  transition:transform .5s ease-out,opacity .5s ease-out;
}
.hint{margin:26px 0 0;font-size:1.1rem;font-weight:600;color:#f3e3b6;letter-spacing:.04em;animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.55}50%{opacity:1}}
.shake .gift{animation:shake .48s linear}
@keyframes shake{
  0%,100%{transform:rotate(0)}15%{transform:rotate(-4deg) translateX(-3px)}30%{transform:rotate(4deg) translateX(3px)}
  45%{transform:rotate(-3deg) translateX(-2px)}60%{transform:rotate(3deg) translateX(2px)}80%{transform:rotate(-1.5deg)}
}
.open .lid{transform:translate(-18px,-70px) rotate(-26deg)}
.open .beam{transform:scaleY(1);opacity:1}
.open .halo{animation-duration:.6s}
.gone .box,.gone .lid,.gone .beam,.gone .halo{transition:transform .25s ease-in,opacity .25s ease-in;transform:scale(1.35);opacity:0;animation:none}
.gone .lid{transform:translate(-18px,-80px) rotate(-30deg) scale(1.3)}
.gone .hint{opacity:0;animation:none}

/* Partículas e flash */
.fx{position:fixed;top:0;left:0;width:0;height:0;z-index:20;pointer-events:none}
.fx i{position:absolute;top:0;left:0;display:block;border-radius:50%}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:19;pointer-events:none;opacity:0}
#flash.go{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* Revelação */
/* Contentor da bebida: altura fixa, imagem assente na base */
.prize{position:relative;height:28vh;max-height:210px;min-height:130px;margin:0 auto 6px}
.prize::before{ /* halo dourado (substitui o drop-shadow) */
  content:"";position:absolute;top:-6%;bottom:-6%;left:50%;width:240px;margin-left:-120px;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(246,212,130,.42),rgba(246,212,130,.12) 55%,rgba(246,212,130,0));
}
.prize::after{ /* sombra elíptica no chão */
  content:"";position:absolute;bottom:-4px;left:50%;width:84px;height:10px;margin-left:-42px;z-index:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));
}
.prize img,.prize svg{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%}
#s3.on .prize::before{animation:halo 2.6s ease-in-out 1s infinite alternate}
@keyframes halo{from{opacity:.75;transform:scale(.94)}to{opacity:1;transform:scale(1.04)}}

/* Logo */
.logo{display:block;margin:0 auto}
.logo img{display:block;width:auto;height:100%;margin:0 auto}
.logo.off{display:none}

/* 0. Pré-página */
#s0 .logo{height:120px;margin-bottom:44px}
.start{
  position:relative;display:flex;align-items:center;justify-content:center;width:96px;height:96px;margin:0 auto;padding:0;
  border:0;border-radius:50%;cursor:pointer;color:#1a1430;
  background:linear-gradient(180deg,#f6d98e,#e2b453);
  box-shadow:0 8px 26px rgba(226,180,83,.35),inset 0 1px 0 rgba(255,255,255,.6);
}
.start::before{
  content:"";position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;border-radius:50%;
  border:2px solid rgba(246,217,142,.7);animation:ring 2s ease-out infinite;
}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.start svg{width:40px;height:40px;margin-left:6px}
.start:active{transform:scale(.96)}
.start:focus-visible,.pb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cap{margin:26px 0 0;font-size:1.15rem;font-weight:600;color:#f3e3b6}

/* Ecrã 1 mais compacto (cabe em 360×640 com logo e player) */
#s1{padding:14px 20px}
#s1 .logo{height:64px;margin-bottom:8px}
#s1 .brand{margin-bottom:6px}
#s1 h1{font-size:1.4rem;margin-bottom:4px}
#s1 .sub{margin-bottom:12px;font-size:.95rem}
#s1 .field{margin-bottom:6px}
#s1 input{min-height:48px;padding:10px 14px}
#s1 .err{margin-top:3px}
#s1 form .btn{margin-top:4px}

/* Player de áudio */
.player{
  display:flex;align-items:center;gap:8px;width:100%;margin:0 0 12px;padding:6px 6px 6px 8px;text-align:left;
  background:rgba(255,255,255,.07);border:1px solid rgba(232,194,106,.4);border-radius:40px;
}
.player.hide{display:none}
.pb{
  position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;
  border:0;border-radius:50%;cursor:pointer;color:#1a1430;background:linear-gradient(180deg,#f6d98e,#e2b453);
}
.pb svg{width:22px;height:22px}
.pb.rep{background:none;color:#f3e3b6}
.pb .i-pause,.pb .spin,.is-playing .pb .i-play,.is-loading .pb .i-play{display:none}
.is-playing .pb .i-pause{display:block}
.is-loading .pb .spin{display:block}
.spin{width:22px;height:22px;border:3px solid rgba(26,20,48,.25);border-top-color:#1a1430;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.is-nudge .pb.main::before{
  content:"";position:absolute;top:-5px;left:-5px;right:-5px;bottom:-5px;border-radius:50%;
  border:2px solid rgba(246,217,142,.8);animation:ring 1.6s ease-out infinite;
}
.eq{flex:none;display:flex;align-items:flex-end;gap:3px;height:20px}
.eq i{display:block;width:3px;height:20px;border-radius:2px;background:#e8c26a;transform-origin:50% 100%;transform:scaleY(.25)}
.is-playing .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}
.eq i:nth-child(3){animation-delay:-.6s}
.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.ptrack{flex:1;min-width:0}
.pbar{height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#e2b453,#f6d98e);transform-origin:0 50%;transform:scaleX(0)}
.ptime{display:block;margin-top:5px;font-size:.8rem;color:#c9cfe2;font-variant-numeric:tabular-nums}
.pna{display:none;flex:1;font-size:.88rem;color:#aab2cc}
.is-off .ptrack,.is-off .eq{display:none}
.is-off .pna{display:block}
.is-off .pb{opacity:.4;cursor:default}

/* Galeria (?galeria=1) */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:26px 12px;width:100%;max-width:360px;margin:0 auto;padding-bottom:24px}
.gal .card{min-width:0}
.gal .prize{margin-bottom:12px;overflow:visible}
.gal .prize::before{width:170px;margin-left:-85px}
.gal .pname{font-size:.72rem;letter-spacing:.12em;margin:0 0 3px}
.gal .phr{margin:0;font-size:.82rem;color:#c9cfe2;line-height:1.3}
.pname{font-size:.95rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#e8c26a;margin:0 0 14px}
h2{font-size:1.7rem;margin:0 0 6px;line-height:1.2}
.won{font-size:1.2rem;margin:0 0 6px;color:#fff}
.won b{color:#f6d98e}
.show{margin:0 0 16px;color:#c9cfe2;font-size:1rem;line-height:1.4}
.code{margin:0 auto 18px;padding:12px 16px;border:1.5px dashed rgba(232,194,106,.7);border-radius:14px;background:rgba(232,194,106,.08)}
.code small{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#d9c08a}
.code strong{display:block;font-size:2rem;letter-spacing:.12em;font-family:ui-monospace,"Courier New",monospace;color:#fff}
#s3.on .prize{animation:rise .9s cubic-bezier(.2,1.2,.4,1) .1s both}
#s3.on .rv{animation:up .5s ease-out both}
#s3.on .pname{animation-delay:.55s}
#s3.on h2{animation-delay:.85s}
#s3.on .won{animation-delay:1.05s}
#s3.on .show{animation-delay:1.2s}
#s3.on .code{animation-delay:1.4s}
#s3.on .btn{animation-delay:1.6s}
#s3:not(.on) .prize,#s3:not(.on) .rv{opacity:0}
@keyframes rise{0%{transform:translateY(70px) scale(.3);opacity:0}70%{transform:translateY(-6px) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .sky::after,.moon::after,.float,.halo,.hint,#s3.on .prize::before,.is-playing .eq i{animation:none}
  .start::before,.is-nudge .pb.main::before{display:none}
  .is-playing .eq i{transform:scaleY(.6)}
  .screen,.screen.on{transform:none}
  #s3.on .prize,#s3.on .rv{animation:fade .6s ease-out both;animation-delay:0s}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<main>
  <!-- 0. Pré-página -->
  <section id="s0" class="screen on">
    <div class="inner">
      <picture class="logo"><source type="image/webp"><img width="193" height="119" alt="" decoding="async"></picture>
      <button class="start" id="start" type="button" aria-label="Ouvir a mensagem e começar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>
      </button>
      <p class="cap">🔊 Liga o som e toca aqui</p>
    </div>
  </section>

  <!-- 1. Formulário -->
  <section id="s1" class="screen">
    <div class="inner">
      <picture class="logo"><source type="image/webp"><img width="193" height="119" alt="" decoding="async"></picture>
      <p class="brand" data-bar></p>
      <h1 tabindex="-1">Tens um presente à tua espera</h1>
      <p class="sub">Deixa o teu nome e WhatsApp. Depois, abre a caixa.</p>
      <div class="player" id="player">
        <button class="pb main" id="pPlay" type="button" aria-label="Ouvir mensagem">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
          <span class="spin" aria-hidden="true"></span>
        </button>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div class="ptrack" aria-hidden="true"><div class="pbar"><i id="pFill"></i></div><span class="ptime" id="pTime">0:00 / 0:00</span></div>
        <span class="pna">Áudio indisponível</span>
        <button class="pb rep" id="pRep" type="button" aria-label="Ouvir de novo">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 3.5v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" autocomplete="given-name" autocapitalize="words" maxlength="40" placeholder="O teu nome" aria-describedby="eName" required>
          <p class="err" id="eName" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="phone">Contacto (WhatsApp)</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="18" placeholder="84 123 4567" aria-describedby="ePhone" required>
          <p class="err" id="ePhone" aria-live="polite"></p>
        </div>
        <button class="btn" type="submit">Receber o meu presente</button>
      </form>
    </div>
  </section>

  <!-- 2. Caixa de presente -->
  <section id="s2" class="screen" aria-labelledby="t2">
    <div class="inner" id="stage">
      <h1 id="t2" class="sr" tabindex="-1">O teu presente</h1>
      <div class="float">
        <button class="gift" id="gift" type="button" aria-label="Abrir o presente">
          <span class="halo"></span>
          <span class="beam"></span>
          <span class="box" id="box"></span>
          <span class="lid"></span>
        </button>
      </div>
      <p class="hint" aria-hidden="true">Toca para abrir</p>
    </div>
  </section>

  <!-- 3. Revelação -->
  <section id="s3" class="screen" aria-live="polite">
    <div class="inner">
      <div class="prize" id="art" aria-hidden="true"></div>
      <p class="pname rv" id="pname"></p>
      <h2 class="rv" id="t3" tabindex="-1"></h2>
      <p class="won rv" id="won"></p>
      <p class="show rv">Mostra este ecrã ao balcão para levantar.</p>
      <div class="code rv"><small>Código de resgate</small><strong id="code"></strong></div>
      <a class="btn rv" id="map" target="_blank" rel="noopener">Ver localização</a>
    </div>
  </section>

  <!-- Galeria (só com ?galeria=1) -->
  <section id="s4" class="screen">
    <div class="inner">
      <p class="brand" data-bar></p>
      <h1 tabindex="-1">Galeria de prémios</h1>
      <div class="gal" id="gal"></div>
    </div>
  </section>
</main>

<script>
/* ================= CONFIGURAÇÃO (editar aqui) ================= */
var BAR_NAME = "Lunar Viewpoint Bar";
var MAPS_URL = "https://maps.app.goo.gl/eN5VgCxrdHsNHE1Y8";
// Áudio de boas-vindas. Vazio = player escondido; se falhar mostra "Áudio indisponível".
var AUDIO_URL = "https://www.dropbox.com/scl/fi/uudzut2v6vldmu854xubb/Lunar-BV-A-v0.1.MP3?rlkey=elsxvdpxj7n0zwb95ijezguyz&st=i44gywms&raw=1";
var LOGO_URL = "img/logo.png"; // ficheiro local; usa também img/logo.webp se existir

/* weight = probabilidade relativa. Todos a 1 = mesma hipótese para todos.
   Ex.: um prémio com weight 2 sai o dobro das vezes de um com weight 1.
   type prepara a próxima fase (desconto, ticket, vip, enigma); por agora tudo "bebida".
   Teste: ?prize=<id> força o prémio; ?galeria=1 mostra todos. */
var PRIZES = [
  { id: "2m-grande", name: "2M Grande", phrase: "uma 2M Grande", type: "bebida", img: "img/2m-grande.webp", weight: 1 },
  { id: "2m-lata", name: "2M Lata", phrase: "uma 2M Lata", type: "bebida", img: "img/2m-lata.webp", weight: 1 },
  { id: "2m-txoti", name: "2M Txoti", phrase: "uma 2M Txoti", type: "bebida", img: "img/2m-txoti.webp", weight: 1 },
  { id: "brutal-fruit-garrafa", name: "Brutal Fruit", phrase: "uma Brutal Fruit", type: "bebida", img: "img/brutal-fruit-garrafa.webp", weight: 1 },
  { id: "brutal-fruit-lata", name: "Brutal Fruit Lata", phrase: "uma Brutal Fruit Lata", type: "bebida", img: "img/brutal-fruit-lata.webp", weight: 1 },
  { id: "castle-lite", name: "Castle Lite", phrase: "uma Castle Lite", type: "bebida", img: "img/castle-lite.webp", weight: 1 },
  { id: "corona-extra", name: "Corona Extra", phrase: "uma Corona Extra", type: "bebida", img: "img/corona-extra.webp", weight: 1 },
  { id: "heineken-lata", name: "Heineken Lata", phrase: "uma Heineken Lata", type: "bebida", img: "img/heineken-lata.webp", weight: 1 },
  { id: "heineken-txoti", name: "Heineken Txoti", phrase: "uma Heineken Txoti", type: "bebida", img: "img/heineken-txoti.webp", weight: 1 },
  { id: "impala-milho-lata", name: "Impala Milho Lata", phrase: "uma Impala Milho Lata", type: "bebida", img: "img/impala-milho-lata.webp", weight: 1 },
  { id: "impala-mandioca-grande", name: "Impala Mandioca Grande", phrase: "uma Impala Mandioca Grande", type: "bebida", img: "img/impala-mandioca-grande.webp", weight: 1 },
  { id: "impala-milho-grande", name: "Impala Milho Grande", phrase: "uma Impala Milho Grande", type: "bebida", img: "img/impala-milho-grande.webp", weight: 1 },
  { id: "impala-milho-txoti", name: "Impala Milho Txoti", phrase: "uma Impala Milho Txoti", type: "bebida", img: "img/impala-milho-txoti.webp", weight: 1 },
  { id: "jc-le-roux-la-fleurette", name: "J.C. Le Roux La Fleurette", phrase: "um J.C. Le Roux La Fleurette", type: "bebida", img: "img/jc-le-roux-la-fleurette.webp", weight: 1 },
  { id: "jc-le-roux-le-domaine", name: "J.C. Le Roux Le Domaine", phrase: "um J.C. Le Roux Le Domaine", type: "bebida", img: "img/jc-le-roux-le-domaine.webp", weight: 1 },
  { id: "jc-le-roux-sauvignon-light", name: "J.C. Le Roux Sauvignon Blanc Light", phrase: "um J.C. Le Roux Sauvignon Blanc Light", type: "bebida", img: "img/jc-le-roux-sauvignon-light.webp", weight: 1 },
  { id: "laurentina-preta", name: "Laurentina Preta", phrase: "uma Laurentina Preta", type: "bebida", img: "img/laurentina-preta.webp", weight: 1 },
  { id: "txilar-lata", name: "Txilar Lata", phrase: "uma Txilar Lata", type: "bebida", img: "img/txilar-lata.webp", weight: 1 }
];
/* ============================================================== */

/* ---------- Imagem do prémio ---------- */
var IMG_W = 210, IMG_H = 360; // caixa de referência (o CSS fixa a altura do contentor)

// Garrafa genérica, sem marca, para quando a imagem não carrega
function fallbackSVG(name) {
  var t = String(name).replace(/[&<>"]/g, function (ch) { return "&#" + ch.charCodeAt(0) + ";"; });
  // nomes longos partem em 2 linhas
  var w = t.split(" "), half = Math.ceil(w.length / 2);
  var label = t.length > 16
    ? '<tspan x="80">' + w.slice(0, half).join(" ") + '</tspan><tspan x="80" dy="17">' + w.slice(half).join(" ") + '</tspan>'
    : t;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" role="img" aria-label="' + t + '" focusable="false">' +
    '<defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#6b5a2e"/><stop offset=".35" stop-color="#d9b25a"/><stop offset="1" stop-color="#5a4a24"/></linearGradient></defs>' +
    '<path d="M68 10h24v8h-2v58c0 14 30 26 30 52v118c0 8-6 12-14 12H54c-8 0-14-4-14-12V128c0-26 30-38 30-52V18h-2z" fill="url(#fg)" stroke="#f6e3a8" stroke-opacity=".6" stroke-width="2"/>' +
    '<rect x="50" y="138" width="7" height="104" rx="3.5" fill="#fff" opacity=".4"/>' +
    '<text x="80" y="292" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#f6d98e">' + label + '</text>' +
    '</svg>';
}

function makeImg(p, lazy) {
  var im = new Image();
  im.alt = p.name;
  im.width = IMG_W;
  im.height = IMG_H;
  im.setAttribute("decoding", "async");
  if (lazy) im.setAttribute("loading", "lazy");
  return im;
}

/* ---------- Lógica ---------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var userName = "", prize = null, opened = false;

  var bars = document.querySelectorAll("[data-bar]");
  for (var b = 0; b < bars.length; b++) bars[b].textContent = BAR_NAME;
  $("map").href = MAPS_URL;

  // Logo: WebP com PNG de recurso; se falhar, esconde-se
  var logos = document.querySelectorAll(".logo");
  for (var l = 0; l < logos.length; l++) {
    var lim = logos[l].querySelector("img"), lsrc = logos[l].querySelector("source");
    lim.alt = BAR_NAME;
    lim.onerror = (function (pic) { return function () { pic.classList.add("off"); }; })(logos[l]);
    if (/\.png$/i.test(LOGO_URL)) lsrc.srcset = LOGO_URL.replace(/\.png$/i, ".webp");
    else lsrc.parentNode.removeChild(lsrc);
    lim.src = LOGO_URL;
  }

  /* ---------- Áudio de boas-vindas (um único objecto) ---------- */
  var player = $("player"), pPlay = $("pPlay"), pFill = $("pFill"), pTime = $("pTime");
  var audio = null, audioOff = false, raf = 0, fading = false;

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function pState(st) { // "paused" | "loading" | "playing" | "nudge" | "off"
    player.className = "player" + (st === "paused" ? "" : " is-" + st);
    pPlay.setAttribute("aria-label", st === "playing" ? "Pausar" : "Ouvir mensagem");
    if (st === "off") { audioOff = true; pPlay.disabled = $("pRep").disabled = true; }
  }
  function paint() {
    var d = audio.duration, t = audio.currentTime;
    var ok = isFinite(d) && d > 0;
    pFill.style.transform = "scaleX(" + (ok ? Math.min(1, t / d) : 0) + ")";
    pTime.textContent = fmt(t) + " / " + (ok ? fmt(d) : "0:00");
  }
  function loop() { paint(); raf = requestAnimationFrame(loop); }
  // Chamado directamente dentro do toque (sem setTimeout/await antes), senão o som é bloqueado
  function playAudio() {
    if (!audio || audioOff) return;
    fading = false;
    audio.volume = 1;
    if (audio.paused) pState("loading");
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { if (!audioOff && audio.paused) pState("nudge"); });
  }

  if (!AUDIO_URL) player.classList.add("hide");
  else {
    audio = new Audio();
    audio.preload = "auto";
    audio.src = AUDIO_URL;
    audio.load();
    audio.addEventListener("playing", function () { pState("playing"); cancelAnimationFrame(raf); loop(); });
    audio.addEventListener("waiting", function () { if (!audio.paused) pState("loading"); });
    audio.addEventListener("pause", function () { cancelAnimationFrame(raf); paint(); if (!audioOff) pState("paused"); });
    audio.addEventListener("ended", function () { cancelAnimationFrame(raf); paint(); pState("paused"); });
    audio.addEventListener("loadedmetadata", paint);
    audio.addEventListener("error", function () { cancelAnimationFrame(raf); pState("off"); });
    pPlay.addEventListener("click", function () {
      if (audioOff) return;
      if (audio.paused) playAudio(); else audio.pause();
    });
    $("pRep").addEventListener("click", function () {
      if (audioOff) return;
      audio.currentTime = 0;
      paint();
      playAudio();
    });
  }
  // Volume até 0 em ~400 ms e pausa (no iPhone o volume é fixo: só pausa no fim)
  function fadeOut() {
    if (!audio || audio.paused || fading) return;
    fading = true;
    var v0 = audio.volume, t0 = Date.now();
    (function step() {
      if (!fading) return;
      var k = Math.min(1, (Date.now() - t0) / 400);
      try { audio.volume = v0 * (1 - k); } catch (e) {}
      if (k < 1) requestAnimationFrame(step);
      else { audio.pause(); fading = false; try { audio.volume = 1; } catch (e) {} }
    })();
  }

  // Pré-página: toca o áudio e avança SEMPRE para o formulário
  var started = false;
  $("start").addEventListener("click", function () {
    if (started) return;
    started = true;
    playAudio();
    show("s1");
  });

  function show(id) {
    var s = document.querySelectorAll(".screen");
    for (var i = 0; i < s.length; i++) s[i].classList.remove("on");
    var el = $(id);
    el.classList.add("on");
    setTimeout(function () {
      var f = el.querySelector("[tabindex='-1']");
      if (f) f.focus();
    }, 400);
  }

  function pickPrize() {
    var m = /[?&]prize=([^&#]*)/i.exec(location.search);
    if (m) {
      var want = decodeURIComponent(m[1]).toLowerCase();
      for (var i = 0; i < PRIZES.length; i++) if (PRIZES[i].id === want) return PRIZES[i];
    }
    var total = 0, j;
    for (j = 0; j < PRIZES.length; j++) total += PRIZES[j].weight;
    var r = Math.random() * total;
    for (j = 0; j < PRIZES.length; j++) { r -= PRIZES[j].weight; if (r < 0) return PRIZES[j]; }
    return PRIZES[PRIZES.length - 1];
  }

  function normPhone(v) {
    var d = v.replace(/[\s\-().]/g, "").replace(/^(\+|00)?258/, "");
    return /^8[2-7]\d{7}$/.test(d) ? d : null;
  }

  function setErr(input, box, msg) {
    $(box).textContent = msg;
    if (msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  }

  var nameIn = $("name"), phoneIn = $("phone");
  nameIn.addEventListener("input", function () { setErr(nameIn, "eName", ""); });
  phoneIn.addEventListener("input", function () { setErr(phoneIn, "ePhone", ""); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var n = nameIn.value.replace(/\s+/g, " ").trim();
    var okName = n.length >= 2, okPhone = !!normPhone(phoneIn.value);
    setErr(nameIn, "eName", okName ? "" : "Escreve o teu nome (mín. 2 letras).");
    setErr(phoneIn, "ePhone", okPhone ? "" : "Número inválido. Ex.: 84 123 4567");
    if (!okName) { nameIn.focus(); return; }
    if (!okPhone) { phoneIn.focus(); return; }
    if (document.activeElement) document.activeElement.blur();

    fadeOut(); // a caixa abre em silêncio
    userName = n; // só em memória
    prize = pickPrize();
    preload(prize);
    $("pname").textContent = prize.name;
    $("t3").textContent = "Parabéns, " + userName + "!";
    $("won").innerHTML = "Ganhaste <b></b>.";
    $("won").querySelector("b").textContent = prize.phrase;
    $("code").textContent = "LUA-" + ("000" + Math.floor(Math.random() * 10000)).slice(-4);
    show("s2");
  });

  // Pré-carrega só a imagem sorteada; enquanto isso a pessoa está no ecrã da caixa
  var artReady = false, onArt = null;
  function setArt(p, im) {
    var art = $("art");
    art.innerHTML = "";
    if (im) art.appendChild(im); else art.innerHTML = fallbackSVG(p.name);
  }
  function preload(p) {
    var im = makeImg(p), settled = false;
    function finish(ok) {
      if (settled) return;
      settled = true;
      setArt(p, ok ? im : null);
      artReady = true;
      if (onArt) { var f = onArt; onArt = null; f(); }
    }
    im.onload = function () {
      if (im.decode) im.decode().then(function () { finish(true); }, function () { finish(true); });
      else finish(true);
    };
    im.onerror = function () { finish(false); };
    im.src = p.img;
  }
  // Corre fn quando a imagem estiver pronta, ou ao fim de maxMs (com a garrafa genérica)
  function whenArt(fn, maxMs) {
    if (artReady) return fn();
    var t = setTimeout(function () {
      onArt = null;
      if (!$("art").firstChild) setArt(prize, null); // a imagem real substitui-a se chegar depois
      fn();
    }, maxMs);
    onArt = function () { clearTimeout(t); fn(); };
  }

  function burst(x, y) {
    if (!document.body.animate) return;
    var layer = document.createElement("div"), left = 36;
    layer.className = "fx";
    layer.style.transform = "translate(" + x + "px," + y + "px)";
    var golds = ["#ffd970", "#e8b84a", "#f6d98e"], silvers = ["#eef2f8", "#c3ccda", "#ffffff"];
    function done() { if (--left === 0 && layer.parentNode) layer.parentNode.removeChild(layer); }
    for (var i = 0; i < 36; i++) {
      var p = document.createElement("i"), s = 4 + Math.random() * 6;
      var pal = i % 2 ? silvers : golds;
      p.style.width = p.style.height = s + "px";
      p.style.marginLeft = p.style.marginTop = -s / 2 + "px";
      p.style.background = pal[i % 3];
      if (i % 3 === 0) p.style.borderRadius = "1px";
      layer.appendChild(p);
      var a = (i / 36) * Math.PI * 2 + Math.random() * 0.3;
      var d = 90 + Math.random() * 130;
      var dx = Math.cos(a) * d, dy = Math.sin(a) * d - 30;
      var anim = p.animate([
        { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
        { transform: "translate(" + dx * 0.8 + "px," + dy * 0.8 + "px) scale(1) rotate(180deg)", opacity: 1, offset: 0.55 },
        { transform: "translate(" + dx + "px," + (dy + 70) + "px) scale(.3) rotate(360deg)", opacity: 0 }
      ], { duration: 1000 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
      anim.onfinish = (function (el) { return function () { el.parentNode && el.parentNode.removeChild(el); done(); }; })(p);
    }
    document.body.appendChild(layer);
    setTimeout(function () { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 2500);
  }

  var gift = $("gift"), stage = $("stage");
  gift.addEventListener("click", function () {
    if (opened) return;
    opened = true;
    gift.setAttribute("aria-disabled", "true");
    if (reduced) { whenArt(function () { show("s3"); }, 1500); return; }

    stage.classList.add("shake");
    setTimeout(function () { stage.classList.add("open"); }, 480);
    // Se a imagem ainda não chegou, a caixa fica aberta a pulsar até 1,5 s extra
    setTimeout(function () { whenArt(explode, 1500); }, 1150);
    function explode() {
      var r = $("box").getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 3;
      var fl = $("flash");
      fl.style.background = "radial-gradient(circle at " + x + "px " + y + "px,rgba(255,246,214,.9),rgba(255,246,214,0) 60%)";
      fl.classList.add("go");
      burst(x, y);
      stage.classList.add("gone");
      show("s3");
    }
  });

  // Modo galeria (?galeria=1): só para rever o visual das 18 bebidas
  if (/[?&]galeria=1(&|#|$)/.test(location.search)) {
    var gal = $("gal");
    for (var g = 0; g < PRIZES.length; g++) {
      var p = PRIZES[g], card = document.createElement("div"), box = document.createElement("div");
      card.className = "card";
      box.className = "prize";
      var im = makeImg(p, true);
      im.onerror = (function (bx, pr) { return function () { bx.innerHTML = fallbackSVG(pr.name); }; })(box, p);
      im.src = p.img;
      box.appendChild(im);
      card.appendChild(box);
      var nm = document.createElement("p"), ph = document.createElement("p");
      nm.className = "pname"; nm.textContent = p.name;
      ph.className = "phr"; ph.textContent = "Ganhaste " + p.phrase + ".";
      card.appendChild(nm); card.appendChild(ph);
      gal.appendChild(card);
    }
    show("s4");
  } else if (/[?&]skip=1(&|#|$)/.test(location.search)) {
    show("s1"); // testes rápidos: sem pré-página e sem áudio automático
  }
})();
</script>
